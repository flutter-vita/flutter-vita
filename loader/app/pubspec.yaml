name: flutter_vita_loader
description: >
  The Vita's deploy loader, as a Flutter app. It receives a build over TCP,
  writes it into the app slot, launches it, and shows you where it is while it
  waits. See docs/adr/0016-the-loader-becomes-a-flutter-app.md.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

vita:
  title_id: FVTA00003
  name: Flutter Vita Loader

flutter:
  uses-material-design: false
