name: conformance
description: What this port can actually do, measured on hardware.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # The two non-endorsed vita implementations, listed alongside the plugins
  # they implement -- exactly the edit ADR-0009 asks an app author to make.
  path_provider: ^2.1.0
  path_provider_vita:
    path: ../../packages/path_provider_vita
  shared_preferences: ^2.2.0
  shared_preferences_vita:
    path: ../../packages/shared_preferences_vita

# Pinned to the dev receiver's slot on purpose. The receiver installs into
# FVTA00002 and nothing else, so a derived id would build a correct .vpk that
# the fast loop cannot deploy. Also exercises the vita: block itself.
vita:
  title_id: FVTA00002
  name: Vita Conformance

flutter:
  uses-material-design: true
