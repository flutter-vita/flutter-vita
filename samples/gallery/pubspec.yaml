name: gallery
description: What this port looks like and what it can do, on one panel.
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # The conformance probes (the Conformance tab, apps/conformance until
  # 2026-09-14) exercise the two non-endorsed vita implementations, listed
  # alongside the plugins they implement -- the edit ADR-0009 asks an app
  # author to make.
  path_provider: ^2.1.0
  path_provider_vita:
    path: ../../plugins/path_provider_vita
  shared_preferences: ^2.2.0
  shared_preferences_vita:
    path: ../../plugins/shared_preferences_vita
  # The Hardware tabs check the console through the pub packages an app
  # author would use, each with its Vita implementation beside it: the
  # package's `vita/` directory holds the C half, compiled into this app.
  battery_plus: ^6.0.0
  battery_plus_vita:
    path: ../../plugins/battery_plus_vita
  sensors_plus: ^6.0.0
  sensors_plus_vita:
    path: ../../plugins/sensors_plus_vita
  device_info_plus: ^11.0.0
  device_info_plus_vita:
    path: ../../plugins/device_info_plus_vita
  connectivity_plus: ^6.0.0
  connectivity_plus_vita:
    path: ../../plugins/connectivity_plus_vita
  record: ^6.0.0
  record_vita:
    path: ../../plugins/record_vita
  audioplayers: ^6.0.0
  audioplayers_vita:
    path: ../../plugins/audioplayers_vita
  camera: ^0.11.0
  camera_vita:
    path: ../../plugins/camera_vita
  # The strip above the tabs. (The engine's own strip, L+R+SELECT, starts
  # hidden in an app that carries this one.)
  vita_debug_strip:
    path: ../../plugins/vita_debug_strip

# Its own slot, so it can sit on the LiveArea beside the receiver's slot. The
# dev loop installs into FVTA00002 whatever this says (tools/deploy.sh).
#
# hardware_checks compiles templates/vita-app/hardware.c into this app and
# links the camera, motion and audio stubs; the Hardware tab talks to it over
# vita/hardware. No other app asks for it.
vita:
  title_id: FVTA00005
  name: Vita Gallery
  hardware_checks: true

flutter:
  uses-material-design: true
  assets:
    # Three seconds of three notes, AAC in an MP4 box, for the audio-file
    # check: the console's own player decodes it (sceAvPlayer), which a tone
    # through sceAudioOut does not prove. It was an MP3 until 2026-09-16;
    # sceAvPlayerAddSource answered 0x806A0002 to that from every path.
    - assets/hardware/tone.m4a
    # The same three seconds with a black 320x240 video track, in case the
    # player wants a video track before it plays anything.
    - assets/hardware/tone.mp4
