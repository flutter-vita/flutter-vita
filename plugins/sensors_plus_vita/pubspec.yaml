name: sensors_plus_vita
description: PlayStation Vita implementation of sensors_plus. Non-endorsed.
version: 0.1.0
repository: https://github.com/flutter-vita/flutter-vita/tree/master/plugins/sensors_plus_vita
issue_tracker: https://github.com/flutter-vita/flutter-vita/issues
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus_platform_interface: ^2.0.0

# The Vita implementation, declared the way every Dart platform implementation
# is. flutter-vita build reads `platforms.vita.dartPluginClass` from each
# resolved package and generates the plugin registrant, so an app registers
# nothing by hand. Upstream Flutter tooling ignores a platform it does not
# know.
flutter:
  plugin:
    implements: sensors_plus
    platforms:
      vita:
        dartPluginClass: SensorsPlusVita
