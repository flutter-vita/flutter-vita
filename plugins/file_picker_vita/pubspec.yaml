name: file_picker_vita
description: PlayStation Vita implementation of file_picker. Non-endorsed. Draws its own browser.
version: 0.1.0
repository: https://github.com/flutter-vita/flutter-vita/tree/master/plugins/file_picker_vita
issue_tracker: https://github.com/flutter-vita/flutter-vita/issues
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^11.0.2
  vita_file_browser: ^0.1.0

# The Vita implementation, declared the way every Dart platform implementation
# is. flutter-vita build reads `platforms.vita.dartPluginClass` from each
# resolved package and generates the plugin registrant, so an app registers
# nothing by hand. Upstream Flutter tooling ignores a platform it does not
# know.
flutter:
  plugin:
    implements: file_picker
    platforms:
      vita:
        dartPluginClass: FilePickerVita
