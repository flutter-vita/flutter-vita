name: shared_preferences_vita
description: PlayStation Vita implementation of shared_preferences. Non-endorsed.
version: 0.1.0
repository: https://github.com/flutter-vita/flutter-vita/tree/master/plugins/shared_preferences_vita
issue_tracker: https://github.com/flutter-vita/flutter-vita/issues
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.0
  path_provider_vita:
    path: ../path_provider_vita

# The Vita implementation, declared the way every Dart platform implementation
# is. flutter-vita build reads `platforms.vita.dartPluginClass` from each
# resolved package and generates the plugin registrant, so an app registers
# nothing by hand. Upstream Flutter tooling ignores a platform it does not
# know.
flutter:
  plugin:
    implements: shared_preferences
    platforms:
      vita:
        dartPluginClass: SharedPreferencesVita
