name: device_info_plus_vita
description: PlayStation Vita implementation of device_info_plus. Non-endorsed.
version: 0.1.0
repository: https://github.com/flutter-vita/flutter-vita/tree/master/plugins/device_info_plus_vita
issue_tracker: https://github.com/flutter-vita/flutter-vita/issues
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus_platform_interface: ^7.0.0
  # For LinuxDeviceInfo: the console reports itself to Dart as Linux, and
  # DeviceInfoPlugin().deviceInfo casts to that on Linux.
  device_info_plus: ^11.0.0
