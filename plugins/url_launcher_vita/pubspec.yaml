name: url_launcher_vita
description: PlayStation Vita implementation of url_launcher. Non-endorsed.
version: 0.1.0
repository: https://github.com/flutter-vita/flutter-vita/tree/master/plugins/url_launcher_vita
issue_tracker: https://github.com/flutter-vita/flutter-vita/issues
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.0

# The Vita implementation, declared the way every Dart platform implementation
# is. flutter-vita build reads `platforms.vita.dartPluginClass` from each
# resolved package and generates the plugin registrant, so an app registers
# nothing by hand. Upstream Flutter tooling ignores a platform it does not
# know.
flutter:
  plugin:
    implements: url_launcher
    platforms:
      vita:
        dartPluginClass: UrlLauncherVita
