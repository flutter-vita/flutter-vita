name: flutter_vita_receiver
description: >
  The Vita's deploy receiver, as a Flutter app. It receives a build over TCP,
  writes it into the app slot, launches it, and shows you where it is while it
  waits. See docs/adr/0016-the-receiver-becomes-a-flutter-app.md.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  # The FILES tab: the card's paths, and sound for what it opens. The Vita
  # half of audioplayers carries its C into this app (ADR-0020).
  audioplayers: ^6.0.0
  audioplayers_vita:
    path: ../../plugins/packages/audioplayers_vita
  vita_file_browser:
    path: ../../plugins/packages/vita_file_browser

vita:
  title_id: FVTA00003
  name: Flutter Vita Receiver

flutter:
  uses-material-design: false
